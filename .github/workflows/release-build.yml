name: Release Build
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NAME: black-hole-stars
  GODOT_VERSION: 4.6.3

jobs:
  export_release_build:
    name: Export release build
    runs-on: ubuntu-latest

    # Needed to publish the release and push to the gh-pages branch
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Pre-build script
        run: bash ${GITHUB_WORKSPACE}/.github/pre-build.sh release

      - name: Export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: false
          archive_output: false
          archive_root_folder: true
          verbose: true
          cache: true

      - name: Post-build script
        run: bash ${GITHUB_WORKSPACE}/.github/post-build.sh release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ steps.export.outputs.archive_directory }}/*
          retention-days: 31

      - name: Publish release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          name: ${{ env.NAME }} ${{ github.ref_name }}
          prerelease: false
          makeLatest: true
          artifacts: ${{ steps.export.outputs.archive_directory }}/*

      - name: Release GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.export.outputs.build_directory }}/web
