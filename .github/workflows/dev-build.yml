name: Dev Build
on:
  push:
    branches: [dev]

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NAME: black-hole-stars
  GODOT_VERSION: 4.6.3

jobs:
  export_debug_build:
    name: Export debug build
    runs-on: ubuntu-latest

    # Needed to release dev-XYZ build on releases
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          archive_output: false
          archive_root_folder: true
          verbose: true
          cache: true

      - name: Include enable-threads.js
        run : |
          cp dist/web/enable-threads.js "${{ steps.export.outputs.build_directory }}/web/"

      - name: Archive artifacts
        run : |
          BUILD_DIR="${{ steps.export.outputs.build_directory }}"
          ARCHIVE_DIR="${{ steps.export.outputs.archive_directory }}"

          mkdir -p "$ARCHIVE_DIR"
          for folder in "$BUILD_DIR/"* ; do
            filename=$(basename $folder)
            cd "$folder"
            zip -r "$ARCHIVE_DIR/$filename.zip" .
          done
      

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-dev-${{ github.run_number }}-${{ github.sha }}
          path: ${{ steps.export.outputs.archive_directory }}/*
          retention-days: 14

      - name: Release dev build
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: dev-${{ github.run_number }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
      - name: Release Github pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.export.outputs.build_directory }}/web
